name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build single-file app
        run: npm run build

      - name: Smoke test in Chrome
        run: node scripts/ci.mjs

      - name: Stage Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp index.html dist/
          touch dist/.nojekyll

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload qdeploy artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: qdeploy-html
          path: dist/index.html
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-qdeploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qdeploy-html
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to markdown.li.qinxing.xyz
        env:
          QDEPLOY_TOKEN: ${{ secrets.QDEPLOY_TOKEN }}
        run: |
          cp dist/index.html index.html
          node scripts/deploy-qdeploy.mjs
